<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Especial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Desativa o realce de toque padrão no mobile */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #15151e 0%, #2b2b36 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
            padding: 20px;
        }

        /* Menu Retrátil */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #e10600;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(225, 6, 0, 0.4);
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -250px;
            width: 250px;
            height: 100%;
            background: #1f1f2a;
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            padding: 80px 20px 20px 20px;
            z-index: 99;
            border-left: 3px solid #e10600;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar a {
            display: block;
            color: #eceff1;
            text-decoration: none;
            padding: 15px 10px;
            border-bottom: 1px solid #2b2b36;
            font-weight: 600;
        }

        .sidebar a:hover {
            color: #e10600;
        }

        /* Card Centralizado */
        .card {
            background: #1f1f2a;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 550px;
            width: 100%;
            border: 1px solid #38384f;
            position: relative;
        }

        h1 {
            color: #fff;
            font-size: 1.6rem;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* Botões */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 70px; /* Aumentado para acomodar botões maiores no mobile */
            align-items: center;
            position: relative;
        }

        .btn {
            padding: 16px 35px; /* Mais padding para facilitar o toque */
            font-size: 1.1rem;
            font-weight: 800;
            border: none;
            border-radius: 8px; /* Bordas um pouco mais arredondadas */
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s, transform 0.1s;
            touch-action: manipulation; /* Melhora a resposta do toque */
        }

        .btn-sim {
            background-color: #e10600;
            color: white;
            box-shadow: 0 4px 10px rgba(225, 6, 0, 0.2);
        }

        .btn-sim:active {
            transform: scale(0.95);
        }

        .btn-nao {
            background-color: #38384f;
            color: #a0a0b8;
            transition: all 0.1s ease;
            z-index: 10;
        }

        /* Classe para o botão fugitivo na última pergunta */
        .btn-nao.fugitivo {
            position: absolute;
        }

        .tela-resultado {
            display: none;
        }

        /* Ajustes para telas bem pequenas */
        @media (max-width: 360px) {
            h1 { font-size: 1.4rem; }
            .btn { padding: 14px 25px; font-size: 1rem; }
            .btn-container { gap: 10px; }
        }
    </style>
</head>
<body>

    <audio id="audioSim" src="Legião Urbana · Tempo perdido(MP3_160K).mp3" preload="auto"></audio>
    <audio id="audioNao" src="tf_nemesis.mp3" preload="auto"></audio>

    <button class="menu-btn" onclick="toggleMenu()">Menu</button>

    <nav class="sidebar" id="sidebar">
        <a href="#" onclick="reiniciar()">Reiniciar</a>
    </nav>

    <main class="card">
        <div id="bloco-quiz">
            <h1 id="texto-pergunta">Pergunta 1 do Quiz</h1>
            
            <div class="btn-container">
                <button class="btn btn-sim" onclick="respostaSim()">Sim</button>
                <button class="btn btn-nao" id="btnNao" onclick="respostaNao()">Não</button>
            </div>
        </div>

        <div class="tela-resultado" id="bloco-resultado">
            <h2 id="titulo-resultado" style="font-size: 2.2rem; margin-bottom: 15px; text-transform: uppercase;"></h2>
            <p id="subtitulo-resultado"></p>
        </div>
    </main>

    <script>
        // Configuração das perguntas do seu quiz
        const perguntas = [
            "Pergunta 1: Você gosta de surpresas?",
            "Pergunta 2: Você prefere o dia ou a noite?",
            "Pergunta Decisiva: Aceita sair comigo?"
        ];

        let perguntaAtual = 0;
        let tentativasNao = 0;
        const LIMITE_TENTATIVAS = 10;

        function atualizarPergunta() {
            document.getElementById('texto-pergunta').innerText = perguntas[perguntaAtual];
            
            const btnNao = document.getElementById('btnNao');
            // Só adiciona a classe que permite posição absoluta na última pergunta
            if (perguntaAtual === perguntas.length - 1) {
                btnNao.classList.add('fugitivo');
            } else {
                btnNao.classList.remove('fugitivo');
                btnNao.style.position = 'static';
            }
        }

        // Inicia a primeira pergunta
        atualizarPergunta();

        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        function moverBotaoNao() {
            const btnNao = document.getElementById('btnNao');
            
            // Define os limites para o botão não sair da tela
            // Usamos padding de 20px das bordas
            const pad = 20;
            const maxWidth = window.innerWidth - btnNao.offsetWidth - pad;
            const maxHeight = window.innerHeight - btnNao.offsetHeight - pad;
            
            const x = Math.max(pad, Math.random() * maxWidth);
            const y = Math.max(pad, Math.random() * maxHeight);
            
            btnNao.style.position = 'fixed';
            btnNao.style.left = x + 'px';
            btnNao.style.top = y + 'px';
        }

        function respostaSim() {
            if (perguntaAtual === perguntas.length - 1) {
                finalizarQuiz('Sim');
            } else {
                proximaPergunta();
            }
        }

        function respostaNao() {
            // Se for a última pergunta...
            if (perguntaAtual === perguntas.length - 1) {
                // ...e ainda não atingiu o limite de fugas...
                if (tentativasNao < LIMITE_TENTATIVAS) {
                    tentativasNao++;
                    moverBotaoNao(); // ...o botão foge ao invés de aceitar o clique
                    return;
                }
                // Se passou do limite, aceita o clique e finaliza
                finalizarQuiz('Não');
            } else {
                // Nas outras perguntas, avança normalmente
                proximaPergunta();
            }
        }

        function proximaPergunta() {
            perguntaAtual++;
            atualizarPergunta();
        }

        function finalizarQuiz(respostaFinal) {
            document.getElementById('bloco-quiz').style.display = 'none';
            
            if (respostaFinal === 'Sim') {
                document.getElementById('audioSim').play();
                document.getElementById('titulo-resultado').innerText = "Excelente Escolha!";
                document.getElementById('titulo-resultado').style.color = "#00ff66";
                document.getElementById('subtitulo-resultado').innerText = "Prepare-se para a Pole Position.";
            } else {
                document.getElementById('audioNao').play();
                document.getElementById('titulo-resultado').innerText = "Bandeira Amarela";
                document.getElementById('titulo-resultado').style.color = "#ffcc00";
                document.getElementById('subtitulo-resultado').innerText = "Você insistiu muito, mas o destino final ainda é comigo.";
            }
            
            document.getElementById('bloco-resultado').style.display = 'block';
        }

        function reiniciar() {
            perguntaAtual = 0;
            tentativasNao = 0;
            
            // Pausa e reseta áudios
            const audioSim = document.getElementById('audioSim');
            audioSim.pause(); audioSim.currentTime = 0;

            const audioNao = document.getElementById('audioNao');
            audioNao.pause(); audioNao.currentTime = 0;

            const btnNao = document.getElementById('btnNao');
            btnNao.style.position = 'static';
            
            atualizarPergunta();
            
            document.getElementById('bloco-quiz').style.display = 'block';
            document.getElementById('bloco-resultado').style.display = 'none';
            toggleMenu();
        }
    </script>

</body>
</html>
