<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Giovana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f0f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Menu Retrátil */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff4d79;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 100;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -250px;
            width: 250px;
            height: 100%;
            background: #fff;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            padding: 80px 20px 20px 20px;
            z-index: 99;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar a {
            display: block;
            color: #333;
            text-decoration: none;
            padding: 15px 10px;
            border-bottom: 1px solid #eee;
            font-weight: 500;
        }

        .sidebar a:hover {
            color: #ff4d79;
        }

        /* Card Centralizado */
        .card {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #ff4d79;
            font-size: 2rem;
            margin-bottom: 35px;
            line-height: 1.4;
        }

        /* Botões */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            min-width: 120px;
        }

        .btn-sim {
            background-color: #ff4d79;
            color: white;
        }

        .btn-sim:hover {
            background-color: #e03a65;
            transform: scale(1.05);
        }

        .btn-nao {
            background-color: #e0e0e0;
            color: #555;
        }

        .btn-nao:hover {
            background-color: #d5d5d5;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <button class="menu-btn" onclick="toggleMenu()">☰ Menu</button>

    <nav class="sidebar" id="sidebar">
        <a href="#" onclick="toggleMenu()">Início</a>
    </nav>

    <main class="card">
        <h1 id="pergunta">Giovana, aqui vai estar a pergunta que você vai criar. Tudo bem?</h1>
        
        <div class="btn-container">
            <button class="btn btn-sim" onclick="resposta('Sim')">Sim</button>
            <button class="btn btn-nao" onclick="resposta('Não')">Não</button>
        </div>
    </main>

    <script>
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        function resposta(opcao) {
            // Insira seu número com DDD e o código do país (55)
            const seuNumero = "5522999999999"; 
            const textoFormatado = encodeURIComponent("Oi! Respondi '" + opcao + "' no seu site.");
            window.open(`https://wa.me/${seuNumero}?text=${textoFormatado}`, '_blank');
        }
    </script>

</body>
</html>
