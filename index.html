<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Corrigido</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #15151e; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; color: #fff; }
        
        .card { background: #1f1f2a; padding: 50px 40px; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; max-width: 550px; width: 90%; border: 1px solid #38384f; position: relative; z-index: 5; }
        
        .btn-container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; position: relative; }
        .btn { padding: 15px 30px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; text-transform: uppercase; }
        
        .btn-sim { background: #e10600; color: #fff; z-index: 10; }
        .btn-nao { background: #38384f; color: #ccc; z-index: 10; transition: none; }
        
        #bloco-quiz, #bloco-resultado { display: none; }
    </style>
</head>
<body>

    <audio id="audioSim" src="Legião Urbana · Tempo perdido(MP3_160K).mp3"></audio>
    <audio id="audioNao" src="tf_nemesis.mp3"></audio>

    <main class="card">
        <div id="bloco-pergunta">
            <h1>Escreva sua pergunta inicial aqui</h1>
            <div class="btn-container">
                <button class="btn btn-sim" onclick="clicouSimInicial()">Sim</button>
                <button class="btn btn-nao" id="btnNao" onclick="fugir()">Não</button>
            </div>
        </div>

        <div id="bloco-quiz">
            <h1 id="texto-quiz"></h1>
            <div class="btn-container">
                <button class="btn btn-sim" onclick="responderQuiz('Sim')">Sim</button>
                <button class="btn btn-nao" onclick="responderQuiz('Não')">Não</button>
            </div>
        </div>

        <div id="bloco-resultado">
            <h2 id="titulo-resultado" style="margin-bottom: 20px;"></h2>
            <button class="btn btn-sim" onclick="reiniciar()">Reiniciar</button>
        </div>
    </main>

    <script>
        const perguntasQuiz = ["Pergunta 1", "Pergunta 2", "Pergunta 3"];
        let tentativas = 0;
        let perguntaAtual = 0;

        function fugir() {
            if (tentativas >= 10) { iniciarQuiz(); return; }
            tentativas++;
            const btnNao = document.getElementById('btnNao');
            btnNao.style.position = 'fixed';
            btnNao.style.left = (Math.random() * 80 + 10) + '%';
            btnNao.style.top = (Math.random() * 80 + 10) + '%';
        }

        function clicouSimInicial() {
            document.getElementById('audioSim').play();
            mostrarResultado("Título do Sim", "#00ff66");
        }

        function iniciarQuiz() {
            document.getElementById('bloco-pergunta').style.display = 'none';
            document.getElementById('bloco-quiz').style.display = 'block';
            document.getElementById('texto-quiz').innerText = perguntasQuiz[0];
        }

        function responderQuiz(resp) {
            if (resp === 'Sim') { reiniciar(); return; }
            perguntaAtual++;
            if (perguntaAtual < perguntasQuiz.length) {
                document.getElementById('texto-quiz').innerText = perguntasQuiz[perguntaAtual];
            } else {
                document.getElementById('audioNao').play();
                mostrarResultado("Fim do Quiz", "#ffcc00");
            }
        }

        function mostrarResultado(tit, cor) {
            document.getElementById('bloco-pergunta').style.display = 'none';
            document.getElementById('bloco-quiz').style.display = 'none';
            const res = document.getElementById('bloco-resultado');
            res.style.display = 'block';
            document.getElementById('titulo-resultado').innerText = tit;
            document.getElementById('titulo-resultado').style.color = cor;
        }

        function reiniciar() {
            tentativas = 0; perguntaAtual = 0;
            document.getElementById('audioSim').pause(); document.getElementById('audioSim').currentTime = 0;
            document.getElementById('audioNao').pause(); document.getElementById('audioNao').currentTime = 0;
            
            const btnNao = document.getElementById('btnNao');
            btnNao.style.position = 'static'; // Garante que volte para o lugar
            
            document.getElementById('bloco-pergunta').style.display = 'block';
            document.getElementById('bloco-quiz').style.display = 'none';
            document.getElementById('bloco-resultado').style.display = 'none';
        }
    </script>
</body>
</html>
