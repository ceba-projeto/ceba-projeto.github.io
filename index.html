<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #15151e 0%, #2b2b36 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        /* Menu Retrátil */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #e10600;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(225, 6, 0, 0.4);
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -250px;
            width: 250px;
            height: 100%;
            background: #1f1f2a;
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            padding: 80px 20px 20px 20px;
            z-index: 99;
            border-left: 3px solid #e10600;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar a {
            display: block;
            color: #eceff1;
            text-decoration: none;
            padding: 15px 10px;
            border-bottom: 1px solid #2b2b36;
            font-weight: 600;
        }

        .sidebar a:hover {
            color: #e10600;
        }

            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 550px;
