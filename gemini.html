
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Giovana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f0f6;
            color: #333;
            overflow-x: hidden;
        }

        /* Menu Retrátil */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff4d79;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 100;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -250px;
            width: 250px;
            height: 100%;
            background: #fff;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            padding: 80px 20px 20px 20px;
            z-index: 99;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar a {
            display: block;
            color: #333;
            text-decoration: none;
            padding: 15px 10px;
            border-bottom: 1px solid #eee;
            font-weight: 500;
        }

        .sidebar a:hover {
            color: #ff4d79;
        }

        /* Conteúdo Principal */
        .container {
            max-width: 800px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        h1 {
            color: #ff4d79;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #555;
            margin-bottom: 30px;
        }

        /* Área de Mensagem Interativa */
        .input-group {
            margin-top: 30px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            border: 2px solid #ffd6e0;
            border-radius: 10px;
            resize: none;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #ff4d79;
        }

        .send-btn {
            background: #ff4d79;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            margin-top: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #e03a65;
        }
    </style>
</head>
<body>

    <button class="menu-btn" onclick="toggleMenu()">☰ Menu</button>

    <nav class="sidebar" id="sidebar">
        <a href="#inicio" onclick="toggleMenu()">Início</a>
        <a href="#mensagem" onclick="toggleMenu()">Enviar Mensagem</a>
    </nav>

    <main class="container" id="inicio">
        <div class="card">
            <h1>Para Giovana</h1>
            <p>Escreva aqui o seu texto personalizado para ela. Seja direto, sincero e evite clichês genéricos. Foque no que torna a sua consideração por ela real e relevante.</p>
            
            <div class="input-group" id="mensagem">
                <textarea id="userMessage" placeholder="Escreva uma resposta ou mensagem aqui..."></textarea>
                <button class="send-btn" onclick="enviarMensagem()">Enviar Mensagem</button>
            </div>
        </div>
    </main>

    <script>
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        function enviarMensagem() {
            const mensagem = document.getElementById('userMessage').value;
            if (!mensagem.trim()) {
                alert('Digite uma mensagem antes de enviar.');
                return;
            }
            
            // Configuração para redirecionar o texto direto para o seu WhatsApp
            const seuNumero = "5522999999999"; // Substitua pelo seu número com DDD (apenas números)
            const textoFormatado = encodeURIComponent("Mensagem da Giovana pelo site: " + mensagem);
            window.open(`https://wa.me/${seuNumero}?text=${textoFormatado}`, '_blank');
        }
    </script>

</body>
</html>
