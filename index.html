<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: linear-gradient(135deg, #15151e 0%, #2b2b36 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; color: #fff; }
        .menu-btn { position: fixed; top: 20px; right: 20px; background: #e10600; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; z-index: 100; font-weight: bold; text-transform: uppercase; box-shadow: 0 4px 15px rgba(225, 6, 0, 0.4); }
        .sidebar { position: fixed; top: 0; right: -250px; width: 250px; height: 100%; background: #1f1f2a; box-shadow: -5px 0 20px rgba(0,0,0,0.5); transition: right 0.3s ease; padding: 80px 20px 20px 20px; z-index: 99; border-left: 3px solid #e10600; }
        .sidebar.active { right: 0; }
        .sidebar a { display: block; color: #eceff1; text-decoration: none; padding: 15px 10px; border-bottom: 1px solid #2b2b36; font-weight: 600; }
        .sidebar a:hover { color: #e10600; }
        .card { background: #1f1f2a; padding: 50px 40px; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); text-align: center; max-width: 550px; width: 90%; border: 1px solid #38384f; position: relative; }
        h1 { color: #fff; font-size: 1.8rem; margin-bottom: 35px; line-height: 1.5; }
        .btn-container { display: flex; justify-content: center; gap: 25px; height: 60px; align-items: center; position: relative; }
        .btn { padding: 14px 45px; font-size: 1.1rem; font-weight: 800; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; transition: background 0.2s, transform 0.1s; }
        .btn-sim, .btn-quiz { background-color: #e10600; color: white; }
        .btn-sim:hover, .btn-quiz:hover { background-color: #b80500; transform: scale(1.05); }
        .btn-nao { background-color: #38384f; color: #a0a0b8; position: absolute; transition: all 0.1s ease; z-index: 10; }
        #bloco-quiz, #bloco-resultado { display: none; }
    </style>
</head>
<body>

    <audio id="audioSim" src="Legião Urbana · Tempo perdido(MP3_160K).mp3" preload="auto"></audio>
    <audio id="audioNao" src="tf_nemesis.mp3" preload="auto"></audio>

    <button class="menu-btn" onclick="toggleMenu()">Menu</button>
    <nav class="sidebar" id="sidebar"><a href="#" onclick="reiniciar()">Reiniciar</a></nav>

    <main class="card">
        <div id="bloco-pergunta">
            <h1>quer oficializar nosso namoro?</h1>
            <div class="btn-container">
                <button class="btn btn-sim" onclick="clicouSimInicial()">Sim</button>
                <button class="btn btn-nao" id="btnNao" onmouseover="fugir()" onclick="iniciarQuiz()">Não</button>
            </div>
        </div>

        <div id="bloco-quiz">
            <h1 id="texto-quiz"></h1>
            <div class="btn-container">
                <button class="btn btn-quiz" onclick="responderQuiz()">Sim</button>
                <button class="btn btn-quiz" onclick="responderQuiz()" style="background-color: #38384f; color: #a0a0b8;">Não</button>
            </div>
        </div>

        <div id="bloco-resultado">
            <h2 id="titulo-resultado" style="font-size: 2.2rem; margin-bottom: 15px; text-transform: uppercase;"></h2>
            <p id="subtitulo-resultado"></p>
        </div>
    </main>

    <script>
        // ADICIONE SUAS PERGUNTAS DO QUIZ AQUI DENTRO DOS COLCHETES:
        const perguntasQuiz = [
            "voçe tem certeza?",
            "serio vc realmente vai fazer isso",
            "voce nem vai tentar o sim"
        ];

        let tentativas = 0;
        let perguntaAtual = 0;

        function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }

        function fugir() {
            if (tentativas >= 10) return;
            tentativas++;
            const btnNao = document.getElementById('btnNao');
            const x = Math.random() * (window.innerWidth - btnNao.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - btnNao.offsetHeight - 40) + 20;
            btnNao.style.position = 'fixed';
            btnNao.style.left = x + 'px';
            btnNao.style.top = y + 'px';
        }

        function clicouSimInicial() {
            document.getElementById('audioSim').play();
            mostrarResultado("serio", "#00ff66", "Texto do Sim.");
        }

        function iniciarQuiz() {
            document.getElementById('audioNao').play();
            document.getElementById('bloco-pergunta').style.display = 'none';
            document.getElementById('bloco-quiz').style.display = 'block';
            document.getElementById('texto-quiz').innerText = perguntasQuiz[0];
        }

        function responderQuiz() {
            perguntaAtual++;
            if (perguntaAtual < perguntasQuiz.length) {
                document.getElementById('texto-quiz').innerText = perguntasQuiz[perguntaAtual];
            } else {
                mostrarResultado("Título Final do Não", "#ffcc00", "Texto final após o quiz.");
            }
        }

        function mostrarResultado(titulo, cor, subtitulo) {
            document.getElementById('bloco-pergunta').style.display = 'none';
            document.getElementById('bloco-quiz').style.display = 'none';
            document.getElementById('titulo-resultado').innerText = titulo;
            document.getElementById('titulo-resultado').style.color = cor;
            document.getElementById('subtitulo-resultado').innerText = subtitulo;
            document.getElementById('bloco-resultado').style.display = 'block';
        }

        function reiniciar() {
            tentativas = 0;
            perguntaAtual = 0;
            
            const audioSim = document.getElementById('audioSim'); audioSim.pause(); audioSim.currentTime = 0;
            const audioNao = document.getElementById('audioNao'); audioNao.pause(); audioNao.currentTime = 0;

            const btnNao = document.getElementById('btnNao');
            btnNao.style.position = 'absolute'; btnNao.style.left = 'auto'; btnNao.style.top = 'auto';
            
            document.getElementById('bloco-pergunta').style.display = 'block';
            document.getElementById('bloco-quiz').style.display = 'none';
            document.getElementById('bloco-resultado').style.display = 'none';
            
            if(document.getElementById('sidebar').classList.contains('active')) toggleMenu();
        }
    </script>

</body>
</html>
