<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #15151e 0%, #2b2b36 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        /* Menu Retrátil */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #e10600;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(225, 6, 0, 0.4);
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -250px;
            width: 250px;
            height: 100%;
            background: #1f1f2a;
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            padding: 80px 20px 20px 20px;
            z-index: 99;
            border-left: 3px solid #e10600;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar a {
            display: block;
            color: #eceff1;
            text-decoration: none;
            padding: 15px 10px;
            border-bottom: 1px solid #2b2b36;
            font-weight: 600;
        }

        .sidebar a:hover {
            color: #e10600;
        }

        /* Card Centralizado */
        .card {
            background: #1f1f2a;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 550px;
            width: 90%;
            border: 1px solid #38384f;
            position: relative;
        }

        h1 {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        /* Botões */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            height: 60px;
            align-items: center;
            position: relative;
        }

        .btn {
            padding: 14px 45px;
            font-size: 1.1rem;
            font-weight: 800;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-sim {
            background-color: #e10600;
            color: white;
        }

        .btn-sim:hover {
            background-color: #b80500;
            transform: scale(1.05);
        }

        .btn-nao {
            background-color: #38384f;
            color: #a0a0b8;
            position: absolute;
            transition: all 0.1s ease;
            z-index: 10;
        }

        .tela-resultado {
            display: none;
        }
    </style>
</head>
<body>

    <button class="menu-btn" onclick="toggleMenu()">Menu</button>

    <nav class="sidebar" id="sidebar">
        <a href="#" onclick="reiniciar()">Reiniciar</a>
    </nav>

    <main class="card">
        <div id="bloco-pergunta">
            <h1 id="texto-pergunta">Escreva sua pergunta aqui</h1>
            
            <div class="btn-container">
                <button class="btn btn-sim" onclick="clicouSim()">Sim</button>
                <button class="btn btn-nao" id="btnNao" onmouseover="fugir()" onclick="clicouNao()">Não</button>
            </div>
        </div>

        <div class="tela-resultado" id="bloco-resultado">
            <h2 id="titulo-resultado" style="font-size: 2.2rem; margin-bottom: 15px; text-transform: uppercase;"></h2>
            <p id="subtitulo-resultado"></p>
        </div>
    </main>

    <script>
        let tentativas = 0;

        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        function fugir() {
            if (tentativas >= 5) return;

            tentativas++;
            const btnNao = document.getElementById('btnNao');
            
            const x = Math.random() * (window.innerWidth - btnNao.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - btnNao.offsetHeight - 40) + 20;
            
            btnNao.style.position = 'fixed';
            btnNao.style.left = x + 'px';
            btnNao.style.top = y + 'px';
        }

        function clicouSim() {
            document.getElementById('bloco-pergunta').style.display = 'none';
            
            // Defina o que aparece quando clica SIM aqui
            document.getElementById('titulo-resultado').innerText = "Título do Sim";
            document.getElementById('titulo-resultado').style.color = "#00ff66";
            document.getElementById('subtitulo-resultado').innerText = "Texto secundário do Sim.";
            
            document.getElementById('bloco-resultado').style.display = 'block';
        }

        function clicouNao() {
            document.getElementById('bloco-pergunta').style.display = 'none';
            
            // Defina o que aparece quando clica NÃO aqui
            document.getElementById('titulo-resultado').innerText = "Título do Não";
            document.getElementById('titulo-resultado').style.color = "#ffcc00";
            document.getElementById('subtitulo-resultado').innerText = "Texto secundário do Não.";
            
            document.getElementById('bloco-resultado').style.display = 'block';
        }

        function reiniciar() {
            tentativas = 0;
            const btnNao = document.getElementById('btnNao');
            btnNao.style.position = 'absolute';
            btnNao.style.left = 'auto';
            btnNao.style.top = 'auto';
            
            document.getElementById('bloco-pergunta').style.display = 'block';
            document.getElementById('bloco-resultado').style.display = 'none';
            toggleMenu();
        }
    </script>

</body>
</html>
